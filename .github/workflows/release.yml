name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v0.6.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  verify:
    name: Verify release candidate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Require the tag to be on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Release tags must point at a commit on main."
            exit 1
          fi

      - name: Check tag matches the workspace version
        id: version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "keres") | .version')
          if [ "v$version" != "$RELEASE_TAG" ]; then
            echo "::error::Tag $RELEASE_TAG does not match workspace version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Test
        run: cargo test --workspace --locked

  publish:
    name: Publish to crates.io
    needs: verify
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable

      # Exchanges the GitHub OIDC token for a short-lived crates.io token.
      # Configure Trusted Publishing for both `keres` and `keres-cli` on
      # crates.io, pointing at this repository and this workflow file.
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          ua="keres-release-workflow (https://github.com/Keres-rs/keres)"

          published() {
            curl -fsS -A "$ua" "https://crates.io/api/v1/crates/$1/$VERSION" >/dev/null 2>&1
          }

          if published keres; then
            echo "keres $VERSION is already on crates.io; skipping"
          else
            echo "Publishing keres $VERSION"
            cargo publish --locked -p keres
          fi

          # The CLI depends on the published library; wait for the index to
          # make the new version visible before publishing it.
          for attempt in $(seq 1 30); do
            if published keres; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "::error::keres $VERSION did not appear on crates.io in time"
              exit 1
            fi
            echo "Waiting for keres $VERSION to be indexed (attempt $attempt/30)"
            sleep 10
          done

          # Publishing can race the sparse index even after the API reports
          # the library, so retry the CLI a few times.
          for attempt in $(seq 1 18); do
            if published keres-cli; then
              echo "keres-cli $VERSION is already on crates.io; skipping"
              break
            fi
            if cargo publish --locked -p keres-cli; then
              break
            fi
            if [ "$attempt" -eq 18 ]; then
              echo "::error::failed to publish keres-cli $VERSION"
              exit 1
            fi
            echo "Retrying keres-cli publish (attempt $attempt/18)"
            sleep 10
          done

  binaries:
    name: Build ${{ matrix.target }}
    needs: publish
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked -p keres-cli --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p dist
          archive="keres-${RELEASE_TAG}-${TARGET}.tar.gz"
          tar -C "target/${TARGET}/release" -czf "dist/${archive}" keres
          ( cd dist && sha256sum "${archive}" > "${archive}.sha256" )

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $archive = "keres-$env:RELEASE_TAG-$env:TARGET.zip"
          Compress-Archive -Path "target/$env:TARGET/release/keres.exe" -DestinationPath "dist/$archive"
          $hash = (Get-FileHash "dist/$archive" -Algorithm SHA256).Hash.ToLower()
          "$hash  $archive" | Set-Content "dist/$archive.sha256"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*"

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  github-release:
    name: Create GitHub Release
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: dist/*
