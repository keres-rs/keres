[package]
name = "keres-desktop"
version = "0.1.0"
edition = "2021"
authors = ["Yash Sharma"]
description = "Keres Desktop: encrypted vaults, password store, and file containers"
license = "Apache-2.0"
repository = "https://github.com/Keres-rs/keres"
keywords = ["encryption", "cryptography", "vault"]
categories = ["cryptography"]

# The GUI has a large, platform-specific dependency tree. Keep it out of the
# library workspace so `cargo test --workspace` stays fast and portable.
[workspace]

[dependencies]
keres = { path = ".." }
arboard = { version = "3", features = ["wayland-data-control"] }
rfd = "0.15"
iced = { version = "0.14.0", default-features = false, features = ["wgpu", "tiny-skia", "tokio", "thread-pool", "x11", "wayland"] }

[dev-dependencies]
tempfile = "3"

[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3
