[workspace]
members = ["crates/keres", "crates/keres-cli"]
resolver = "2"

[workspace.package]
version = "0.5.0"
edition = "2021"
rust-version = "1.75"
authors = ["Yash Sharma"]
license = "Apache-2.0"
repository = "https://github.com/Keres-rs/keres"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
rpassword = "7"

[profile.release]
lto = true
codegen-units = 1
strip = true

[profile.release.package.keres-cli]
opt-level = "z"
