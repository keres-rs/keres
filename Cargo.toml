[package]
name = "krypton-core"
version = "0.4.0"
edition = "2021"
rust-version = "1.75"
authors = ["Yash Sharma"]
description = "A memory-safe, high-performance Rust library for modern file encryption and secure vaults."
license = "Apache-2.0"
repository = "https://github.com/KryptonOSS/krypton"
keywords = ["encryption", "aes", "cryptography", "vault", "argon2"]
categories = ["cryptography", "filesystem"]
readme = "README.md"

[dependencies]
aes-gcm = "0.10"
argon2 = "0.5"
hkdf = "0.12"
sha2 = "0.10"
subtle = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
zeroize = { version = "1.7", features = ["derive"] }
walkdir = "2.5"

[dev-dependencies]
tempfile = "3.12"

[profile.release]
lto = true
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
all = "warn"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
