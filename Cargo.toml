[package]
name = "keres"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "A memory-safe, high-performance Rust library for modern file encryption and secure vaults."
license.workspace = true
repository.workspace = true
homepage = "https://keres-rs.github.io"
documentation = "https://docs.rs/keres"
keywords = ["encryption", "aes", "cryptography", "vault", "argon2"]
categories = ["cryptography", "filesystem"]
readme = "README.md"
exclude = [
    ".envrc",
    ".github",
    "deny.toml",
    "docs",
    "flake.lock",
    "flake.nix",
    "fuzz",
    "keres-cli",
]

[lib]
name = "keres"

[dependencies]
aes-gcm = "0.10"
argon2 = "0.5"
fs4 = { version = "1.1", default-features = false, features = ["sync"] }
hkdf = "0.12"
sha2 = "0.10"
subtle = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
zeroize = { version = "1.7", features = ["derive"] }
walkdir = "2.5"

[dev-dependencies]
criterion = "0.5"
fs4 = { version = "1.1", default-features = false, features = ["sync"] }
sha2 = "0.10"
tempfile = "3.12"

[[bench]]
name = "throughput"
harness = false

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
all = "warn"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[workspace]
members = ["keres-cli"]
default-members = [".", "keres-cli"]
exclude = ["fuzz", "keres-desktop"]
resolver = "2"

[workspace.package]
version = "0.7.1"
edition = "2021"
rust-version = "1.85"
authors = ["Yash Sharma"]
license = "Apache-2.0"
repository = "https://github.com/Keres-rs/keres"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
rpassword = "7"
zeroize = { version = "1.7", features = ["derive"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

[profile.release.package.keres-cli]
opt-level = "z"
