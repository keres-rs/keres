[package]
name = "keres"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "A memory-safe, high-performance Rust library for modern file encryption and secure vaults."
license.workspace = true
repository.workspace = true
homepage = "https://keres-rs.github.io"
documentation = "https://docs.rs/keres"
keywords = ["encryption", "aes", "cryptography", "vault", "argon2"]
categories = ["cryptography", "filesystem"]
readme = "README.md"

[lib]
name = "keres"

[dependencies]
aes-gcm = "0.10"
argon2 = "0.5"
fs4 = { version = "1.1", default-features = false, features = ["sync"] }
hkdf = "0.12"
sha2 = "0.10"
subtle = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
zeroize = { version = "1.7", features = ["derive"] }
walkdir = "2.5"

[dev-dependencies]
fs4 = { version = "1.1", default-features = false, features = ["sync"] }
tempfile = "3.12"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
all = "warn"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
